name: Deploy Lambda

on:
  push:
    branches:
      - main
      - test
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11
        cache: 'pip'
    
    # Optional step retained from your original draft 
    - name: Install local runner dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Set environment variables
      id: set-env-vars
      run: |
        if [[ "${{ github.ref_name }}" == "main" ]]; then
          echo "ENV=prod" >> $GITHUB_ENV
          echo "API_KEY=prod_api_key" >> $GITHUB_ENV
          echo "LOG_LEVEL=INFO" >> $GITHUB_ENV
        else
          echo "ENV=test" >> $GITHUB_ENV
          echo "API_KEY=test_api_key" >> $GITHUB_ENV
          echo "LOG_LEVEL=DEBUG" >> $GITHUB_ENV
        fi

    - name: Package Lambda Function
      run: |
        cd lambda_function
        # 1. Create a clean, separate directory for the artifact
        mkdir package

        # 2. Target the package directory directly for dependencies
        # Assuming requirements.txt is located inside the lambda_function folder. 
        # If it is in the root directory, change the path to ../requirements.txt
        pip install --no-cache-dir -r requirements.txt -t ./package

        # 3. Copy your application file into the root of that package directory
        cp app.py ./package/

        # 4. Zip everything from inside the folder to avoid nested directory structures
        cd package
        zip -r ../../lambda.zip .
        cd ../..

    - name: Deploy to AWS Lambda
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
      run: |
        FUNCTION_NAME="cicd_lambda_${{ github.ref_name }}"
        REGION="us-east-1"
        echo "Deploying to Lambda function: $FUNCTION_NAME"

        # Check if the Lambda function exists using exit codes instead of parsing output string
        if aws lambda get-function --function-name "$FUNCTION_NAME" --region "$REGION" > /dev/null 2>&1; then
          FUNCTION_EXISTS="true"
        else
          FUNCTION_EXISTS="false"
        fi

        ENV_VARS="Variables={ENV=${{ env.ENV }},API_KEY=${{ env.API_KEY }},LOG_LEVEL=${{ env.LOG_LEVEL }}}"

        if [ "$FUNCTION_EXISTS" == "false" ]; then
          echo "Creating Lambda function $FUNCTION_NAME..."
          aws lambda create-function \
            --function-name "$FUNCTION_NAME" \
            --runtime python3.11 \
            --role arn:aws:iam::894759052187:role/test_lambda_dev \
            --handler app.lambda_handler \
            --timeout 300 \
            --zip-file fileb://lambda.zip \
            --region "$REGION" \
            --environment "$ENV_VARS"
        else
          echo "Updating Lambda function $FUNCTION_NAME..."
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --region "$REGION" \
            --zip-file fileb://lambda.zip

          # Optimized native AWS CLI wait command instead of custom while loop
          echo "Waiting for function code update to complete..."
          aws lambda wait function-updated --function-name "$FUNCTION_NAME" --region "$REGION"

          # Update function configuration
          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --region "$REGION" \
            --environment "$ENV_VARS"
        fi
